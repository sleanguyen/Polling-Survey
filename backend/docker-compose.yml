services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pollingsurvey-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pollingsurvey-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pollingsurvey-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pollingsurvey-network
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: PollingSurvey.API/Dockerfile
    container_name: pollingsurvey-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=PollSurveyDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      JwtSettings__Key: ${JWT_KEY}
      JwtSettings__Issuer: ${JWT_ISSUER:-PollingSurvey.API}
      JwtSettings__Audience: ${JWT_AUDIENCE:-PollingSurvey.Client}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pollingsurvey-network
    restart: unless-stopped

volumes:
  sqlserver_data:
  redis_data:

networks:
  pollingsurvey-network:
    driver: bridge