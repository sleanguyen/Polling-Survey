name: Backend CI

on:
  push:
    branches:
      - main
      - dev
      - week_3_task
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci.yml'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/PollingSurvey.slnx

      - name: Build solution
        run: dotnet build backend/PollingSurvey.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/PollingSurvey.slnx --configuration Release --no-build --verbosity normal

  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/PollingSurvey.API/Dockerfile
          push: true
          tags: |
            seojax/pollingsurvey-api:latest
            seojax/pollingsurvey-api:${{ github.sha }}
